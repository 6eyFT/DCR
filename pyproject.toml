[project]
name = "diamond-city-radio"
version = "0.1.0"
description = "A Fallout-inspired local radio player built with pygame and Tkinter."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "pygame>=2.6,<3.0",
    "pillow>=10,<12",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
